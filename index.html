<!DOCTYPE html>
<!-- PANAL FAMILIAR · configurador (muestra) · v1.4 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panal Familiar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171a">
<link rel="apple-touch-icon" href="ICONS/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14171a;--card:#1d2226;--line:#333b42;--tx:#e9e6df;--mut:#9aa3a8;--ac:#e0a437;--bad:#e5735f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'IBM Plex Sans',sans-serif;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
main{max-width:920px;margin:0 auto}
h1{font:600 18px 'IBM Plex Mono',monospace;color:var(--ac);letter-spacing:.06em}
h2{font-size:21px;margin:18px 0 6px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.bar{display:flex;gap:4px;margin-top:10px}.bar i{flex:1;height:4px;background:var(--line);border-radius:2px}.bar i.on{background:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],textarea{width:100%;background:#111416;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:500 15px 'IBM Plex Sans',sans-serif;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#17130a;font-weight:600}
button.sel{border-color:var(--ac);color:var(--ac);background:#2a2518}
button:disabled{opacity:.35;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:12px}.step b{min-width:22px;text-align:center;font:600 20px 'IBM Plex Mono',monospace}.step button{width:44px;height:44px;font-size:20px;padding:0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.stage{background:#e9e4da;border-radius:12px;padding:10px;overflow:auto}
.stage svg{display:block;width:100%;height:auto;margin:0 auto}
.hex,.celda{cursor:pointer}
#menu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 16px));display:flex;gap:4px;padding:6px;background:#0d0f11f2;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px #0009;z-index:30}
#menu button{flex:1;padding:6px 0;font-size:12px;border-color:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
#menu button span{font-size:19px;line-height:1.2}
#capa{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
#capa[hidden]{display:none}
#capa .dentro{max-width:920px;margin:0 auto}
.stage.entero svg{min-width:0!important}
.stage.grande svg{min-width:760px!important}
.atajos{margin-top:12px}.atajos button{padding:7px 10px;font-size:14px}
input,textarea,#crop{scroll-margin:100px}
.flip{transform-box:fill-box;transform-origin:center;transition:transform .22s ease-in}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--line)}.sw.sel{border-color:#fff}
.info{font:500 13px 'IBM Plex Mono',monospace;color:var(--mut);margin:8px 0 12px}
.warn{color:var(--bad);font-size:14px;margin-top:6px}
.ok{color:#8fbf7f;font-size:14px;margin-top:6px}
.edit{display:grid;gap:12px}@media(min-width:720px){.edit{grid-template-columns:1fr 1fr}}
.prev svg{display:block;width:100%;max-width:240px;margin:0 auto}
#crop{touch-action:none;cursor:grab}
#visor{overflow:auto;max-height:65vh;background:#555;border-radius:8px}#lz{display:block;height:auto;cursor:crosshair}
.cnt{text-align:right;font:500 12px 'IBM Plex Mono',monospace;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--tx);font-size:15px}.chk input{width:20px;height:20px;flex:none;accent-color:var(--ac)}
ul{padding-left:20px}
</style>
</head>
<body>
<main>
  <h1>⬢ PANAL FAMILIAR</h1>
  <div class="bar" id="bar"></div>
  <div id="app"></div>
</main>
<div id="capa" hidden></div>
<nav id="menu" aria-label="Menú"></nav>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
